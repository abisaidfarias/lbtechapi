name: Deploy to PRODUCTION

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Ejecución manual con confirmación
    inputs:
      confirm_deploy:
        description: '⚠️ Escribe "DEPLOY" para confirmar el despliegue a producción'
        required: true
        type: string

jobs:
  build:
    # Se ejecuta automáticamente en push a main
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            abisaid/lbtechapi:${{ steps.vars.outputs.sha_short }}
            abisaid/lbtechapi:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Requiere aprobación manual si es push automático
    # Si es workflow_dispatch con "DEPLOY", se ejecuta automáticamente
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deploy == 'DEPLOY') ||
      (github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lbonetrack.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Dockerrun.aws.json for PROD
        run: |
          cat > Dockerrun.aws.json << EOF
          {
              "AWSEBDockerrunVersion":"1",
              "Image":{
                  "Name":"abisaid/lbtechapi:prod-latest",
                  "Update":"true"
              },
              "Ports":[
                  {
                      "ContainerPort":"8080"
                  }
              ]
          }
          EOF

      - name: Deploy to Elastic Beanstalk PROD
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: lbtechapi
          environment_name: lbtechapi-prod
          region: us-east-1
          version_label: prod-${{ github.sha }}
          deployment_package: Dockerrun.aws.json

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for deployment to stabilize..."
          sleep 90
          echo "🔍 Checking health endpoint..."
          curl -f http://lbtechapi-prod.eba-p26pfjvm.us-east-1.elasticbeanstalk.com/health || exit 1
          echo ""
          echo "✅ PRODUCTION deployment successful!"

