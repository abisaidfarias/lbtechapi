host: localhost:8080
info:
  contact:
    email: support@lbtech.com
    name: API Support
  description: API para gestión de homologaciones y dispositivos
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: LBTech API
  version: "1.0"
paths:
  /brand:
    get:
      consumes:
      - application/json
      description: Obtiene la lista de todas las marcas
      produces:
      - application/json
      responses:
        "200":
          description: Lista de marcas
          schema:
            items:
              $ref: '#/definitions/responses.Brand'
            type: array
        "401":
          description: No autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Listar marcas
      tags:
      - Brands
    post:
      consumes:
      - application/json
      description: Crea una nueva marca en el sistema
      parameters:
      - description: Datos de la marca
        in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/request.Brand'
      produces:
      - application/json
      responses:
        "201":
          description: Marca creada exitosamente
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: No autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Marca duplicada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Crear nueva marca
      tags:
      - Brands
  /company:
    get:
      consumes:
      - application/json
      description: Obtiene la lista de todas las compañías
      produces:
      - application/json
      responses:
        "200":
          description: Lista de compañías
          schema:
            items:
              $ref: '#/definitions/responses.CompanyListItem'
            type: array
        "401":
          description: No autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Listar compañías
      tags:
      - Companies
    post:
      consumes:
      - application/json
      description: Crea una nueva compañía en el sistema
      parameters:
      - description: Datos de la compañía
        in: body
        name: company
        required: true
        schema:
          $ref: '#/definitions/request.Company'
      produces:
      - application/json
      responses:
        "201":
          description: Compañía creada exitosamente
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: No autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Compañía duplicada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Crear nueva compañía
      tags:
      - Companies
  /company/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina una compañía del sistema
      parameters:
      - description: ID de la compañía
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Compañía eliminada exitosamente
        "401":
          description: No autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Compañía no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: No se puede eliminar, existen dependencias
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Eliminar compañía
      tags:
      - Companies
    put:
      consumes:
      - application/json
      description: Actualiza una compañía existente
      parameters:
      - description: ID de la compañía
        in: path
        name: id
        required: true
        type: string
      - description: Datos actualizados de la compañía
        in: body
        name: company
        required: true
        schema:
