  /imei-validation/validator/batches:
    get:
      description: Newest first. search matches the batch code or a batch holding
        an IMEI starting with those digits.
      parameters:
      - description: ready | registered
        in: query
        name: status
        type: string
      - description: batch code or IMEI
        in: query
        name: search
        type: string
      - description: page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ImeiBatchPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 'IMEI Validator: list batches'
      tags:
      - ImeiValidator
    post:
      consumes:
      - multipart/form-data
      description: Parses a .csv (; or ,) or .xlsx with IMEI;S/N;quantity and no header.
        Validates IMEI (15 digits + Luhn), S/N, quantity and the rows per S/N, and
        stores only complete devices whose IMEIs are all new, as "ready" in a new
        batch (batch is null when nothing is new).
      parameters:
      - description: .csv or .xlsx file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.ImeiBatchUploadResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 'IMEI Validator: upload a batch'
      tags:
      - ImeiValidator
