<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table width="600" style="background:#ffffff; border:1px solid #e5e7eb;">
          <tr>
            <td style="background:#0b1736; padding:20px 32px; color:#ffffff; font-size:18px; font-weight:600;">
              LB OneTrack
            </td>
          </tr>
          <tr>
            <td style="height:4px; background:#8DB319;"></td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <div style="font-size:16px; font-weight:600;">Hello {{ .Name }},</div>
              <div style="margin-top:16px; font-size:15px; color:#374151; line-height:1.7;">
                {{ .BodyText }}
              </div>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;">
                <tr>
                  {{ .ActionButton }}
                </tr>
              </table>
              <div style="margin-top:24px; font-size:13px; color:#6b7280; line-height:1.6;">
                If you did not request this, you can ignore this email. The link expires in {{ .ExpiresHours }} hours.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
